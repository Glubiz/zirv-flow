[package]
name = "zirv-flow"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A self-hosted marketing automation tool: connect data sources, segment your people, and run automation flows."
readme = "../../README.md"
keywords = ["marketing-automation", "segmentation", "self-hosted", "automation", "workflow"]
categories = ["web-programming"]

[dependencies]
clap.workspace = true
figment.workspace = true
hashbrown.workspace = true
metrics-exporter-prometheus.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
reqwest.workspace = true
rustls.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
zirv-flow-api.workspace = true
zirv-flow-jobs.workspace = true
zirv-flow-render.workspace = true
zirv-flow-store.workspace = true
# Only for the browser test server (#315), behind `browser-test`: the harness it reuses drives the
# router and the worker through these and reaches the local SMTP sink and the fixture resolver.
axum = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
time = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
zirv-flow-connectors = { workspace = true, features = ["test-support"], optional = true }
zirv-flow-core = { workspace = true, optional = true }

[features]
# The test server of the Playwright tests. Never a default feature and never in a release build,
# the Dockerfile or CD: it refuses to compile unless ZIRV_FLOW_BROWSER_TEST_BUILD is set, and
# scripts/check-bench-features.sh checks that nothing shipped names it.
browser-test = [
    "dep:axum", "dep:http-body-util", "dep:serde_json", "dep:sqlx", "dep:time", "dep:tower",
    "dep:uuid", "dep:zirv-flow-connectors", "dep:zirv-flow-core", "zirv-flow-store/test-support",
]

[[bin]]
name = "zirv-flow"
path = "src/main.rs"

[[bin]]
name = "zirv-flow-browser-test"
path = "src/browser_test/main.rs"
required-features = ["browser-test"]

[dev-dependencies]
axum.workspace = true
http-body-util.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tower.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
uuid.workspace = true
# The end-to-end send test (#232) drives the API router and a real worker in one process, so it
# reaches the test doubles of the lower crates: the local SMTP sink, the fixture DNS resolver and
# the fake email provider.
zirv-flow-connectors = { workspace = true, features = ["test-support"] }
zirv-flow-core.workspace = true
zirv-flow-store = { workspace = true, features = ["test-support"] }
