[package]
name = "zirv-flow-connectors"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util = { workspace = true, features = ["alloc"] }
hashbrown.workspace = true
hickory-resolver.workspace = true
metrics.workspace = true
mysql_async.workspace = true
rand.workspace = true
ring.workspace = true
rskafka.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
url.workspace = true
webpki-roots.workspace = true
zeroize.workspace = true
zirv-flow-core.workspace = true
# Only for the SMTP sink behind `test-support`: its certificate authority.
rcgen = { workspace = true, optional = true }
# Only for the DKIM signature check behind `test-support`.
rsa = { workspace = true, optional = true }

[features]
# The in-memory fake source, registered for tests of this crate and of crates that use it.
test-support = ["dep:rcgen", "dep:rsa"]

[dev-dependencies]
proptest.workspace = true
zirv-flow-core = { workspace = true, features = ["test-support"] }
axum.workspace = true
futures-util = { workspace = true, features = ["std"] }
metrics-exporter-prometheus.workspace = true
rcgen.workspace = true
tracing-subscriber.workspace = true
rsa.workspace = true
tokio = { workspace = true, features = ["test-util"] }
