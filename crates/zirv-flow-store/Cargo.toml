[package]
name = "zirv-flow-store"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
flate2.workspace = true
hashbrown.workspace = true
metrics.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
uuid.workspace = true
zirv-flow-core.workspace = true

[features]
# BENCHMARK ONLY (architecture section 19, decision-log overhead): turns decision appends into
# no-ops. Never enable it in a release build, the Dockerfile or CD; scripts/check-bench-features.sh
# fails CI if they do, and it does not compile without ZIRV_FLOW_BENCH_BUILD=1. Tests that read
# decisions fail with it on, by design.
bench-no-decisions = []
# TEST ONLY: exposes `secrets::insert_unchecked` and `replace_unchecked`, which plant secret rows
# without the writer check. Enabled by dev-dependencies only; never in a normal build.
test-support = []

[dev-dependencies]
metrics-exporter-prometheus.workspace = true
