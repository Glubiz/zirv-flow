[package]
name = "zirv-flow-renderbench"
description = "Render benchmark of a typical block email through the real render pool (issue #317). Not shipped."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "renderbench"
path = "src/main.rs"

# The render children are this same executable run as `render-host`, so the benchmark needs no
# server binary and nothing depends on it.
[dependencies]
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
zirv-flow-render.workspace = true
zirv-flow-templates.workspace = true
