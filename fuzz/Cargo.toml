[package]
name = "zirv-flow-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
zirv-flow-segments = { path = "../crates/zirv-flow-segments", features = ["test-support"] }
zirv-flow-connectors = { path = "../crates/zirv-flow-connectors", features = ["test-support"] }
zirv-flow-templates = { path = "../crates/zirv-flow-templates", features = ["test-support"] }

[[bin]]
name = "segment_ast"
path = "fuzz_targets/segment_ast.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "template_document"
path = "fuzz_targets/template_document.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sanitize_source"
path = "fuzz_targets/sanitize_source.rs"
test = false
doc = false
bench = false
