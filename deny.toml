# Schema: cargo-deny 0.18.4, pinned in both audit workflows.
# https://github.com/EmbarkStudios/cargo-deny/blob/0.18.4/deny.template.toml

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa via openidconnect verifies public keys; DKIM signing uses ring. Reviewed 2026-10-27 in SECURITY.md; remove when rsa is fixed or absent." },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via openidconnect: no elliptic-curve private-key operation. Reviewed 2026-10-27 in SECURITY.md; upstream upgrade tracked in #269." },
]

[licenses]
# Derived from cargo metadata --format-version 1 --offline on 2026-10-27.
# OR expressions use their permissive alternative; AND terms remain required.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
include-dev = true
# MPL's file-level obligations apply to these crates, not to the MIT project.
# See SECURITY.md for the dependency paths and distribution obligations.
exceptions = [
    { crate = "cssparser@0.38.0", allow = ["MPL-2.0"] },
    { crate = "dtoa-short@0.3.5", allow = ["MPL-2.0"] },
    { crate = "option-ext@0.2.0", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are allowed because every workspace crate is private.
allow-wildcard-paths = true
# Cargo.lock has openssl-probe (certificate discovery), but no OpenSSL TLS stack.
deny = [{ crate = "openssl", reason = "TLS uses rustls with ring" }]
# Reviewed against Cargo.lock and metadata reverse edges on 2026-10-27.
# Skip only the older, exact versions: new duplicates still produce a warning.
skip = [
    { crate = "base64@0.21.7", reason = "openidconnect 4" },
    { crate = "base64@0.22.1", reason = "oauth2, reqwest 0.12, SQLx and database protocols" },
    { crate = "bitflags@1.3.2", reason = "defmt" },
    { crate = "block-buffer@0.10.4", reason = "digest 0.10 alongside RustCrypto 0.11" },
    { crate = "const-oid@0.9.6", reason = "der, rsa and digest 0.10" },
    { crate = "core-foundation@0.9.4", reason = "system-configuration alongside rustls-platform-verifier" },
    { crate = "cpufeatures@0.2.17", reason = "curve25519-dalek and SHA 0.10" },
    { crate = "crypto-common@0.1.6", reason = "digest 0.10" },
    { crate = "darling@0.20.11", reason = "derive_builder alongside serde_with" },
    { crate = "darling_core@0.20.11", reason = "darling 0.20" },
    { crate = "darling_macro@0.20.11", reason = "darling 0.20" },
    { crate = "digest@0.10.7", reason = "OIDC, rsa, elliptic-curve and SASL still use RustCrypto 0.10" },
    { crate = "getrandom@0.2.17", reason = "ring, oauth2 and rand_core 0.6" },
    { crate = "getrandom@0.3.4", reason = "mysql_common and rand_core 0.9" },
    { crate = "hashbrown@0.12.3", reason = "indexmap 1 via serde_with" },
    { crate = "hashbrown@0.16.1", reason = "hashlink, metrics-util and sqlx-core" },
    { crate = "hkdf@0.12.4", reason = "elliptic-curve 0.13" },
    { crate = "hmac@0.12.1", reason = "OIDC, hkdf 0.12, rfc6979 and SASL" },
    { crate = "indexmap@1.9.3", reason = "serde_with retains support for indexmap 1 and 2" },
    { crate = "itertools@0.10.5", reason = "openidconnect alongside mrml and prost" },
    { crate = "phf@0.12.1", reason = "chrono-tz" },
    { crate = "phf@0.13.1", reason = "tokio-postgres alongside web_atoms" },
    { crate = "phf_shared@0.12.1", reason = "phf 0.12" },
    { crate = "phf_shared@0.13.1", reason = "phf 0.13" },
    { crate = "r-efi@5.3.0", reason = "getrandom 0.3" },
    { crate = "rand@0.8.8", reason = "OIDC, RSA key generation, SASL and Kafka" },
    { crate = "rand@0.9.5", reason = "metrics-util and opentelemetry_sdk" },
    { crate = "rand_chacha@0.3.1", reason = "rand 0.8" },
    { crate = "rand_core@0.6.4", reason = "rand 0.8 and RustCrypto elliptic-curve/rsa" },
    { crate = "rand_core@0.9.5", reason = "rand 0.9" },
    { crate = "reqwest@0.12.28", reason = "oauth2 alongside OTLP and direct reqwest 0.13" },
    { crate = "schemars@0.9.0", reason = "serde_with supports both schema generations" },
    { crate = "serde_spanned@0.6.9", reason = "toml 0.8 and toml_edit" },
    { crate = "sha1@0.10.7", reason = "mysql_common alongside sqlx-mysql" },
    { crate = "sha2@0.10.9", reason = "OIDC, elliptic curves, MySQL, SASL and SQLx" },
    { crate = "syn@2.0.119", reason = "derive_builder, SQLx and older derive macros alongside syn 3" },
    { crate = "synstructure@0.13.2", reason = "asn1-rs-derive alongside ICU derive macros" },
    { crate = "thiserror@1.0.69", reason = "OIDC, oauth2, async-socks5 and rskafka" },
    { crate = "thiserror-impl@1.0.69", reason = "thiserror 1" },
    { crate = "toml@0.8.23", reason = "figment alongside direct toml 1" },
    { crate = "toml_datetime@0.6.11", reason = "toml 0.8 and toml_edit" },
    { crate = "wasi@0.11.1+wasi-snapshot-preview1", reason = "getrandom 0.2, mio and quanta alongside wasite" },
    { crate = "windows-sys@0.52.0", reason = "ring alongside current platform dependencies" },
    { crate = "winnow@0.7.15", reason = "toml_edit alongside toml 1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
