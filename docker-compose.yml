# Quickstart: zirv-flow and PostgreSQL on one machine.
# The credentials below are for local use only. Change them for anything else.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zirv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zirv-quickstart}
      POSTGRES_DB: ${POSTGRES_DB:-zirv_flow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the master key on first start and keeps it on later ones.
  zirv-flow-key:
    build: .
    image: ghcr.io/glubiz/zirv-flow:latest
    command: ["admin", "generate-master-key", "--out", "/var/lib/zirv-flow/secrets/master.key", "--if-missing"]
    restart: "no"
    volumes:
      - zirv-flow-secrets:/var/lib/zirv-flow/secrets

  zirv-flow:
    build: .
    image: ghcr.io/glubiz/zirv-flow:latest
    command: ["all"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      zirv-flow-key:
        condition: service_completed_successfully
    volumes:
      - zirv-flow-secrets:/var/lib/zirv-flow/secrets:ro
    environment:
      ZIRV_FLOW_SECRETS__MASTER_KEY_FILE: /var/lib/zirv-flow/secrets/master.key
      ZIRV_FLOW_DATABASE__URL: postgres://${POSTGRES_USER:-zirv}:${POSTGRES_PASSWORD:-zirv-quickstart}@postgres:5432/${POSTGRES_DB:-zirv_flow}
      ZIRV_FLOW_DATABASE__MIGRATE_ON_START: "true"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
  zirv-flow-secrets:
