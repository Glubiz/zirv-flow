name: CI Pipeline

# CI gates merges on PRs targeting main or a release/**
# integration branch, version tags (including the upgrade drill), and on demand.
# It deliberately does NOT run on branch pushes
# to main — a commit can only reach main through a PR that already passed
# these exact checks, and the CD pipeline publishes from main directly
# instead of chaining off a post-merge CI run.
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [ main, 'release/**' ]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Upgrade candidate GHCR version tag; empty builds this ref'
        required: false
        default: ''
      previous_tag:
        description: 'Previous stable version; empty selects the latest published older release'
        required: false
        default: ''

jobs:
  docs:
    name: Documentation links and guide accuracy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Documentation checker self-test
        run: python3 scripts/check-docs.py --self-test
      - name: Check links, API routes, configuration and flow nodes
        run: python3 scripts/check-docs.py

  test:
    name: Test, Lint, and Format Check
    runs-on: ubuntu-latest
    # A hung build or test must fail the run, not hold it for
    # the 6-hour default.
    timeout-minutes: 45
    steps:
      # fetch-depth: 0 (full history, not the default shallow depth-1 clone):
      # the test-presence gate below and the version-bump job need a common
      # ancestor with main actually present in history, which a depth-1
      # checkout of just the PR ref would not have.
      - name: Checkout Code
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      # `fetch-depth: 0` above fetches full history for every branch and tag,
      # so `origin/${{ github.base_ref }}` already resolves here without a
      # separate fetch. Runs before the build: a missing test is cheaper to
      # report before spending the rest of this job's time on it.
      - name: Test-presence gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD~1"
          fi
          bash scripts/check-test-presence.sh --base "$base"

      # The gate proves itself on every run, not just when someone remembers
      # to re-run --self-test locally.
      - name: Test-presence gate self-test
        run: bash scripts/check-test-presence.sh --self-test

      - name: Threat model evidence
        run: bash scripts/check-threat-model.sh

      - name: Threat model evidence self-test
        run: bash scripts/check-threat-model.sh --self-test

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Crate dependency gate
        run: bash scripts/check-crate-deps.sh

      - name: Crate dependency gate self-test
        run: bash scripts/check-crate-deps.sh --self-test

      - name: Cache Cargo Registry
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo Build
        uses: actions/cache@v4.3.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # Builds the binary up front so tests that spawn it as a subprocess find
      # target/debug/zirv-flow.
      - name: Build Binary
        run: cargo build

      # The benchmark-only `bench-no-decisions` feature cannot compile without the
      # ZIRV_FLOW_BENCH_BUILD guard variable; this proves it, and that no shipped-build input
      # (CD, Dockerfile, compose, scripts they run) mentions either. After the build so the
      # check reuses the target directory.
      - name: Benchmark feature gate
        run: bash scripts/check-bench-features.sh

      - name: Benchmark feature gate self-test
        run: bash scripts/check-bench-features.sh --self-test

      - name: M8 benchmark driver self-test
        run: bash scripts/bench/m8/run.sh --self-test

      - name: M8 benchmark report check self-test
        run: bash scripts/bench/m8/check-report.sh --self-test

      - name: M8 benchmark data files
        run: bash scripts/bench/m8/check-report.sh --data-only

      - name: M8 benchmark report
        if: ${{ hashFiles('docs/benchmarks/m8-validation.md') != '' }}
        run: bash scripts/bench/m8/check-report.sh

      # Catches canonical context drift before it ships: a CLAUDE.md/AGENTS.md
      # regenerated from an older `.zirv/context/` than what is on this branch
      # silently injects the canonical layer twice every session. `--check`
      # fails the PR the moment a managed native file no longer byte-matches a
      # fresh render of the current canonical sources.
      #
      # zirv itself is not built in this repo, so the gate runs a pinned
      # release of it. The download is verified against the release's own
      # .sha256 file (sha256sum text format) before anything is extracted.
      # Bump ZIRV_VERSION deliberately when the context format changes.
      - name: Context sync drift gate
        env:
          ZIRV_VERSION: 4.59.0
        run: |
          set -euo pipefail
          base="https://github.com/Glubiz/zirv-cli/releases/download/v${ZIRV_VERSION}"
          asset="zirv-${ZIRV_VERSION}-linux.tar.gz"
          dir="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$dir/$asset" "$base/$asset"
          curl -fsSL --retry 3 -o "$dir/$asset.sha256" "$base/$asset.sha256"
          (cd "$dir" && sha256sum -c "$asset.sha256")
          tar -xzf "$dir/$asset" -C "$dir"
          "$dir/zirv" context sync --check

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-nextest@0.9.143

      # nextest runs each test in its own process, so process-wide
      # `env::set_var` races cannot happen -- see .config/nextest.toml.
      # `--no-fail-fast` runs every test and reports a complete list of
      # failures; nextest's own default is fail-fast, which would otherwise
      # stop at the first failure and hide the rest.
      - name: Run Tests
        run: cargo nextest run --no-fail-fast

      - name: Check Code Formatting
        run: cargo fmt -- --check

      - name: Run Clippy Lint
        run: cargo clippy --all-targets -- -D warnings

      # The benchmark-only feature has to keep compiling cleanly.
      - name: Run Clippy Lint (bench-no-decisions)
        env:
          ZIRV_FLOW_BENCH_BUILD: "1"
        run: cargo clippy -p zirv-flow-store --features bench-no-decisions -- -D warnings

  openapi-breaking:
    name: OpenAPI Breaking Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      - name: Install pinned oasdiff
        env:
          # https://github.com/oasdiff/oasdiff/releases/tag/v1.34.0
          # https://github.com/oasdiff/oasdiff/releases/download/v1.34.0/checksums.txt
          OASDIFF_VERSION: 1.34.0
          OASDIFF_SHA256: 7c88e09fd500b231af2819eb21f6fdfc7bcdfe2741d2c1937c59e7b72c8a575a
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          asset="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
          curl -fsSL --retry 3 "$url/$asset" -o "$dir/$asset"
          curl -fsSL --retry 3 "$url/checksums.txt" -o "$dir/checksums.txt"
          # Check both the reviewable pin and the release's published checksum.
          grep -Fx "$OASDIFF_SHA256  $asset" "$dir/checksums.txt"
          (cd "$dir" && printf '%s  %s\n' "$OASDIFF_SHA256" "$asset" | sha256sum -c -)
          tar -xzf "$dir/$asset" -C "$dir" oasdiff
          echo "$dir" >> "$GITHUB_PATH"

      - name: OpenAPI gate self-test
        run: bash scripts/openapi-gate/self-test.sh

      - name: Compare the branch and frozen API contracts
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          document=crates/zirv-flow-api/openapi.json
          dir=$(mktemp -d)
          git show "origin/$BASE_REF:$document" > "$dir/base.json"
          baselines=()
          # rc1 starts the freeze; keep that baseline through the rc series.
          # After 1.0, always compare the immutable v1.0.0 contract too.
          for tag in v1.0.0-rc.1 v1.0.0; do
            if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
              git show "refs/tags/$tag:$document" > "$dir/$tag.json"
              baselines+=("$dir/$tag.json")
            fi
          done
          bash scripts/openapi-gate/check.sh "$dir/base.json" "$document" "${baselines[@]}"

  release-scripts:
    name: Release Script Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0
      - name: SemVer precedence self-test
        run: bash scripts/semver-compare.sh --self-test
      - name: Changelog self-test
        run: bash scripts/generate-changelog.sh --self-test
      - name: Release flags self-test
        run: bash scripts/release-flags.sh --self-test
      - name: Upgrade drill self-test
        run: bash scripts/drill/upgrade.sh --self-test
      - name: Upgrade drill shellcheck
        run: shellcheck -x scripts/drill/upgrade.sh scripts/drill/guide.sh

  web:
    name: Web UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0

      - name: Set Up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Audit Production Dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Generated API Client Is Current
        run: npm run gen:api:check

      - name: Build
        run: npm run build

  # Browser end-to-end tests (#315): Playwright drives Chromium against the test server, which
  # runs the e2e harness behind a loopback listener on a scratch database. The feature and its
  # build variable are named here and in web/e2e/playwright.config.ts only
  # (scripts/check-bench-features.sh keeps every shipped build input clear of them).
  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0

      - name: Set Up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        run: npm ci
        working-directory: web

      # The server binary embeds web/dist, so the bundle is built first.
      - name: Build Web Bundle
        run: npm run build
        working-directory: web

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo Build
        uses: actions/cache@v4.3.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-browser-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-browser-

      - name: Build Test Server
        run: ZIRV_FLOW_BROWSER_TEST_BUILD=1 cargo build --features browser-test --bin zirv-flow-browser-test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-nextest@0.9.143

      - name: Test The Test Server
        run: ZIRV_FLOW_BROWSER_TEST_BUILD=1 cargo nextest run --features browser-test --bin zirv-flow-browser-test

      - name: Install Chromium
        run: npm run e2e:install
        working-directory: web

      - name: Run Browser Tests
        run: npm run e2e
        working-directory: web

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report
            web/e2e/test-results
          if-no-files-found: ignore

  postgres:
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      ZIRV_FLOW_TEST_MYSQL_URL: mysql://root:mysql@127.0.0.1:3306/mysql
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo Build
        uses: actions/cache@v4.3.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-nextest@0.9.143

      # The Kafka tests are ignored like the PostgreSQL ones and run in the step below. The
      # script starts a Redpanda broker and an Apache Kafka broker with SASL, both advertising
      # localhost, and prints the variables the tests read.
      - name: Start The Kafka Fixtures
        run: bash scripts/kafka-fixture.sh | sed 's/^export //' >> "$GITHUB_ENV"

      - name: Run PostgreSQL Tests
        run: cargo nextest run --run-ignored only --no-fail-fast

      - name: Upgrade integrity SQL self-test
        run: bash scripts/drill/upgrade.sh --self-test-postgres

  # Kafka needs C code (lz4 and zstd) and TLS (ring) in the static musl build the release image
  # ships. This builds and runs the Kafka tests against a real broker natively on amd64.
  kafka-musl:
    name: Kafka (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0

      - name: Install The musl Toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Registry
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-registry-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-nextest@0.9.143

      - name: Start The Kafka Fixtures
        run: bash scripts/kafka-fixture.sh | sed 's/^export //' >> "$GITHUB_ENV"

      # The Kafka connector's tests, with and without a broker: TLS on ring, SASL, and the four
      # compression codecs, linked against musl.
      - name: Run The Kafka Connector Tests
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: >-
          cargo nextest run -p zirv-flow-connectors --target ${{ matrix.target }}
          --run-ignored all --no-fail-fast -E 'test(kafka)'

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0

      - name: Dependency policy gate
        run: bash scripts/check-dependency-policy.sh

      - name: Dependency policy gate self-test
        run: bash scripts/check-dependency-policy.sh --self-test

      - name: Set Up Rust Toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.20
        with:
          tool: cargo-deny@0.20.2

      - name: Audit Dependencies
        run: cargo deny --locked check

  # PRs into `release/**` integration branches share one pinned release
  # version, so they are exempt. This check still guards every PR into main,
  # where CD is idempotent on an already-published version and a bump is what
  # makes a code change actually ship. It only requires a version bump when
  # the diff since the base branch touches a path that changes the shipped
  # binary (src/, crates/, Cargo.toml, Cargo.lock, build.rs); a README/docs/CI-only PR
  # passes unbumped.
  version-bump:
    name: Version Bump Check
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so `origin/${{ github.base_ref }}...HEAD` has a real
      # merge base to diff from -- mirrors the security-scan job below,
      # which needs the same thing for the same reason. A depth-1 checkout
      # plus a depth-1 fetch of just the base ref gives two disconnected
      # single commits with no common ancestor, so the three-dot form can't
      # resolve a merge base at all.
      - name: Checkout Code
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      - name: Require a version above the base branch when shipped code changed
        run: |
          BASE="origin/${{ github.base_ref }}"
          extract() { grep '^version' "$1" | head -1 | sed -E 's/version *= *"([^"]+)".*/\1/'; }
          # The very first PR (the one that introduces Cargo.toml) has no
          # base version to compare against; there is nothing to enforce yet.
          if ! git show "$BASE:Cargo.toml" > /tmp/base-Cargo.toml; then
            echo "::notice::${{ github.base_ref }} has no Cargo.toml yet -- version bump check skipped"
            exit 0
          fi
          BASE_VERSION=$(extract /tmp/base-Cargo.toml)
          HEAD=$(extract Cargo.toml)
          echo "base branch version: $BASE_VERSION — PR version: $HEAD"

          # A LOWER version always fails, unconditionally, before the path
          # filter below even runs -- origin/<base_ref> is the branch's
          # current tip, not the merge-base, so main can have bumped past
          # what this PR branched from with no local Cargo.toml edit at all;
          # skipping this check on a docs-only diff would let that
          # regressed, inherited version slip through unnoticed.
          ORDER=$(bash scripts/semver-compare.sh "$HEAD" "$BASE_VERSION")
          if [ "$ORDER" = "-1" ]; then
            echo "::error file=Cargo.toml::Version ($HEAD) is lower than ${{ github.base_ref }}'s ($BASE_VERSION)."
            exit 1
          fi

          # --no-renames: a file renamed OUT of src/ or crates/ (or Cargo.toml/.lock/
          # build.rs) would otherwise show only under its destination path,
          # hiding the shipped-code change from this filter.
          CHANGED=$(git diff --name-only --no-renames "$BASE...HEAD")
          if ! echo "$CHANGED" | grep -qE '^src/|^crates/|^Cargo\.toml$|^Cargo\.lock$|^build\.rs$'; then
            echo "::notice::no shipped-code paths changed since ${{ github.base_ref }} (src/, crates/, Cargo.toml, Cargo.lock, build.rs) -- version bump not required"
            exit 0
          fi
          if [ "$ORDER" = "0" ]; then
            echo "::error file=Cargo.toml::Version ($HEAD) is unchanged from ${{ github.base_ref }} but shipped code changed. Bump it -- a version bump is what makes CD actually publish the change."
            exit 1
          fi

      # An ADVISORY hint only, from the same conventional-commit reading
      # `scripts/generate-changelog.sh` uses for CHANGELOG.md itself -- it
      # never decides the actual bump size (the gate above still requires
      # SOME increase whenever shipped code changed) or fails the PR.
      # `if: always()` so the hint prints even when the gate above already
      # failed. `continue-on-error: true` so a bug in the script can never
      # turn an advisory step into a gate.
      - name: Suggest bump size from conventional commits (advisory)
        if: always()
        continue-on-error: true
        run: |
          BASE="origin/${{ github.base_ref }}"
          SUGGESTION=$(bash scripts/generate-changelog.sh --suggest-bump --from "$BASE" --to HEAD)
          echo "::notice::conventional-commit suggested bump size: $SUGGESTION"

  # An ADVISORY nudge, never a gate -- `continue-on-error: true` on top of the
  # script's own always-0 exit means this job can never fail the PR no matter
  # what it finds. PR-only (a push has no base commit to diff against in this
  # repo's rebase-merge workflow) and needs full history the same way the
  # `test` job's checkout gets it: a depth-1 checkout plus a SEPARATE depth-1
  # fetch of the base ref leaves the two shallow histories with no common
  # ancestor object, so `git diff base...HEAD` in security-scan.sh could not
  # find a merge base and would fail -- silently, if that failure were
  # swallowed into an empty diff, making the scan a permanent silent no-op.
  security-scan:
    name: Advisory Security Scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      - name: Run advisory scan
        run: bash scripts/security-scan.sh --base "origin/${{ github.base_ref }}" >> "$GITHUB_STEP_SUMMARY"

      # The scan proves itself on every run too.
      - name: Advisory scan self-test
        run: bash scripts/security-scan.sh --self-test

  upgrade-drill:
    name: Upgrade Drill
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      # Match the version-bump job's diff filter; do not filter the whole workflow,
      # whose other checks remain required for every PR.
      - name: Select changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          run=true
          guide=true
          if [[ "$EVENT" == pull_request ]]; then
            changed=$(git diff --name-only --no-renames "origin/$BASE_REF...HEAD")
            if ! grep -qE '^crates/zirv-flow-store/migrations/|^scripts/drill/|^\.github/workflows/ci\.yaml$' <<< "$changed"; then
              run=false
            fi
            if ! grep -qE '^docs/guide/getting-started\.md$|^docker-compose\.yml$|^scripts/drill/(lib\.sh|guide\.sh|guide-nginx\.conf|compose\.guide\.yaml|upgrade-fixture\.py|upgrade-diagnostics\.py)$|^web/e2e/guide/|^web/e2e/playwright\.config\.ts$|^\.github/workflows/ci\.yaml$' <<< "$changed"; then
              guide=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "guide=$guide" >> "$GITHUB_OUTPUT"

      - name: Select previous published release
        if: steps.paths.outputs.run == 'true'
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag || 'upgrade-drill' }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: bash scripts/drill/upgrade.sh --select-previous --image "$IMAGE_TAG" --previous "$PREVIOUS_TAG"

      - name: Set Up Docker Buildx
        if: (steps.previous.outputs.previous != '' || steps.paths.outputs.guide == 'true') && inputs.image_tag == ''
        uses: docker/setup-buildx-action@v3.11.1

      - name: Build candidate image
        if: (steps.previous.outputs.previous != '' || steps.paths.outputs.guide == 'true') && inputs.image_tag == ''
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/glubiz/zirv-flow:upgrade-drill
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upgrade populated database
        if: steps.previous.outputs.previous != ''
        env:
          IMAGE_TAG: ${{ inputs.image_tag || 'upgrade-drill' }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.previous }}
        run: bash scripts/drill/upgrade.sh --image "$IMAGE_TAG" --previous "$PREVIOUS_TAG"

      # Reuses the image above, but starts the quickstart on fresh volumes. A previous
      # release is not needed for this walkthrough; guide-only PRs can run it alone.
      - name: Set Up Node for walkthrough
        if: steps.paths.outputs.guide == 'true'
        uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install walkthrough browser
        if: steps.paths.outputs.guide == 'true'
        working-directory: web
        run: |
          npm ci
          npm run e2e:install

      - name: Getting-started walkthrough
        id: guide
        if: steps.paths.outputs.guide == 'true'
        env:
          IMAGE_TAG: ${{ inputs.image_tag || 'upgrade-drill' }}
        run: bash scripts/drill/guide.sh

      - name: Upload guide screenshots
        if: steps.guide.outcome == 'success'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: getting-started-screenshots
          path: web/e2e/test-results/guide-screenshots/*.png
          if-no-files-found: error

  # Proves the clean-checkout promise of the README quickstart: the image
  # builds, the compose stack comes up healthy and /readyz answers 200.
  # CI and CD both build linux/amd64.
  container-smoke-test:
    name: Container Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      # Loads the image under the name docker-compose.yml expects, so the
      # `up` below uses it instead of building a second time.
      - name: Build Image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/glubiz/zirv-flow:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start The Compose Stack
        run: docker compose up -d --no-build --wait --wait-timeout 120

      - name: Check Readiness
        run: curl -fsS http://localhost:8080/readyz

      - name: Check The Web UI Is Served
        run: curl -fsS http://localhost:8080/ | grep -q 'id="root"'

      # The M1 exit flow through /api/v1 alone: claim the instance with the
      # setup token from the log, create a workspace and a read-only API key,
      # then read the workspace with only that key. Secrets stay in shell
      # variables and are masked; nothing is echoed.
      - name: Check The API Flow
        run: |
          set -euo pipefail
          base=http://localhost:8080/api/v1

          token=$(docker compose logs --no-color zirv-flow \
            | sed -nE 's/.*setup token ([^ ,"]+).*/\1/p' | head -n1)
          test -n "$token"
          password=$(openssl rand -hex 16)
          echo "::add-mask::$token"
          echo "::add-mask::$password"

          test "$(curl -fsS "$base/setup" | jq -r .required)" = true

          # The session cookie is Secure by default, and curl's cookie jar may
          # refuse it over plain http, so it is read from the response headers.
          headers=$(mktemp)
          csrf=$(jq -n --arg token "$token" --arg password "$password" \
              '{token: $token, email: "owner@example.com", password: $password}' \
            | curl -fsS -D "$headers" -X POST "$base/setup" \
                -H 'content-type: application/json' --data-binary @- \
            | jq -r .csrf_token)
          session=$(tr -d '\r' < "$headers" \
            | sed -nE 's/^[Ss]et-[Cc]ookie: (zf_session=[^;]+).*/\1/p' | head -n1)
          test -n "$csrf" && test -n "$session"
          echo "::add-mask::$csrf"
          echo "::add-mask::$session"

          test "$(curl -fsS "$base/setup" | jq -r .required)" = false

          workspace=$(curl -fsS -X POST "$base/workspaces" \
              -H "cookie: $session" -H "x-csrf-token: $csrf" \
              -H 'content-type: application/json' \
              -d '{"name": "Smoke test"}' \
            | jq -r .id)
          test -n "$workspace"

          key=$(curl -fsS -X POST "$base/workspaces/$workspace/api-keys" \
              -H "cookie: $session" -H "x-csrf-token: $csrf" \
              -H 'content-type: application/json' \
              -d '{"name": "smoke test", "scopes": ["read"]}' \
            | jq -r .key)
          echo "::add-mask::$key"

          # No cookie and no CSRF token: only the key authenticates this read.
          test "$(curl -fsS "$base/workspaces/$workspace" \
              -H "authorization: Bearer $key" | jq -r .id)" = "$workspace"
          echo "API flow passed"

      - name: Print Logs On Failure
        if: failure()
        run: docker compose logs

      - name: Tear Down
        if: always()
        run: docker compose down -v
