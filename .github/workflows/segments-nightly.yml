name: Segments Nightly

# The compiled segment SQL checked against the reference evaluator on PostgreSQL with a random
# seed and many cases (architecture section 18; ruling 3724f651). CI runs the same tests with a
# fixed seed and 64 cases. A failure prints the seed, the definition and the person's data in
# the log; rerun it with the workflow_dispatch inputs. Nothing is filed: the log is the report.
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed to reproduce a failure (a u64); empty picks a random one'
        required: false
        default: ''
      cases:
        description: 'Number of cases'
        required: false
        default: '2000'
      enrollments:
        description: 'Enrollments in the flow simulation'
        required: false
        default: '200000'

permissions:
  contents: read

jobs:
  compare:
    name: Compare on PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 18]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo Build
        uses: actions/cache@v4.3.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # One seed for both PostgreSQL versions would hide a version-specific disagreement
      # behind the same data, so each job draws its own and prints it.
      - name: Choose The Seed
        env:
          INPUT_SEED: ${{ github.event.inputs.seed }}
          INPUT_CASES: ${{ github.event.inputs.cases }}
        run: |
          seed="${INPUT_SEED:-}"
          if [ -z "$seed" ]; then
            seed="$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')"
          fi
          cases="${INPUT_CASES:-2000}"
          case "$seed$cases" in
            *[!0-9]*) echo "the seed and the case count must be numbers" >&2; exit 1 ;;
          esac
          echo "ZIRV_FLOW_PROPTEST_SEED=$seed" >> "$GITHUB_ENV"
          echo "ZIRV_FLOW_PROPTEST_CASES=$cases" >> "$GITHUB_ENV"
          echo "PostgreSQL ${{ matrix.pg }}: seed $seed, $cases cases"

      # `cargo test`, not nextest: one test runs all the cases, and nextest's slow-test
      # timeout would end it.
      - name: Evaluator Properties
        run: cargo test -p zirv-flow-segments --lib generate:: -- --nocapture

      - name: Compare The SQL With The Evaluator
        run: >-
          cargo test -p zirv-flow-jobs --lib segment_compare:: -- --ignored --nocapture
          --test-threads 2

  # The flow engine's deterministic simulation (architecture section 18, layer 1): a large
  # population over 90 virtual days against the in-memory commit protocol, with random crashes
  # inside and after each transaction, under a random seed. It needs no database. CI runs the same
  # test with fixed seeds and a modest population, plus the sweep that crashes after every effect
  # of every step. A failure prints its seed and population in the log; rerun it
  # with the workflow_dispatch inputs (the `seed` input is shared with the job above).
  flow-simulation:
    name: Flow Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.4.0

      - name: Set Up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo Build
        uses: actions/cache@v4.3.0
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Choose The Seed And The Population
        env:
          INPUT_SEED: ${{ github.event.inputs.seed }}
          INPUT_ENROLLMENTS: ${{ github.event.inputs.enrollments }}
        run: |
          seed="${INPUT_SEED:-}"
          if [ -z "$seed" ]; then
            seed="$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')"
          fi
          enrollments="${INPUT_ENROLLMENTS:-200000}"
          case "$seed$enrollments" in
            *[!0-9]*) echo "the seed and the enrollment count must be numbers" >&2; exit 1 ;;
          esac
          echo "ZIRV_FLOW_SIM_SEED=$seed" >> "$GITHUB_ENV"
          echo "ZIRV_FLOW_SIM_ENROLLMENTS=$enrollments" >> "$GITHUB_ENV"
          echo "Flow simulation: seed $seed, $enrollments enrollments"

      # `cargo test`, not nextest, as above: the seed and population come from the environment,
      # and only this test reads them.
      - name: Simulate
        run: >-
          cargo test -p zirv-flow-engine --lib sim::tests::the_population_holds_all_four_invariants
          -- --nocapture
