name: CD Pipeline

permissions:
  contents: write

# CD runs directly on the merge push to main (ADR-005, from M1 on). CI is not
# re-run after the merge: it already gated the PR, so the merge commit's push
# goes straight to release. A merge that does not bump the version re-runs
# the pipeline idempotently: the release step skips a published version.
# workflow_dispatch stays for re-running a failed release by hand.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# One release at a time: a second merge waits for the first run's tag and
# changelog push instead of racing it.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    # Only release from main: workflow_dispatch can be invoked from any
    # ref, and an off-main run would publish whatever version that ref carries.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      published: ${{ steps.release.outputs.published }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VER=$(grep '^version' Cargo.toml \
            | head -n1 \
            | sed -E 's/version *= *"([^"]+)".*/\1/')
          echo "version=$VER" >> $GITHUB_OUTPUT

      # A light script (not release-please -- that stages its own release PR and
      # drops the per-PR version bump this repo's linear rebase-merge model
      # relies on). Generates the one section for this
      # release from conventional commits since the previous tag and, on a
      # first run for this tag, inserts it into CHANGELOG.md (regenerated
      # only, per scripts/generate-changelog.sh's own header -- never hand-
      # edited) and commits that ahead of the tag, so the tag itself points
      # at a commit that already carries its own changelog entry.
      # `[skip ci]` stops the push below from re-triggering this same
      # workflow (native GitHub Actions support, no extra config needed).
      # The tag is pushed BEFORE the changelog commit: the tag (and the
      # release built from it) is the load-bearing artifact, the changelog
      # commit on main is cosmetic and regenerable. A failed tag push fails
      # the job cleanly with nothing touched, same as before reordering; a
      # failed changelog push is caught and logged as a warning instead,
      # since the release is already correct by that point and the next
      # release's nearest_tag lookup folds in whatever section got missed.
      # The workflow-level concurrency group keeps a second merge's run from
      # racing this changelog push, and this order can no longer strand a
      # tagless commit on main the way the old order could.
      - name: Update CHANGELOG.md And Create Tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="v${{ steps.get_version.outputs.version }}"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # No --from: the script's own nearest-tag lookup excludes HEAD
          # itself (looks at HEAD^), which matters on a re-run after a
          # previous attempt already created $TAG on HEAD -- resolving the
          # previous tag here manually would otherwise find $TAG itself and
          # produce an empty range.
          DATE=$(date -u +%Y-%m-%d)
          bash scripts/generate-changelog.sh --section --to HEAD \
            --header "## ${TAG} (${DATE})" > changelog-section.md

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists -- CHANGELOG.md not touched again"
          else
            if [ ! -f CHANGELOG.md ]; then
              bash scripts/generate-changelog.sh --print-header > CHANGELOG.md
            fi
            # Insert just before the first existing "## v..." section (or at
            # end of file when this is the very first entry after the header).
            first=$(grep -n '^## v' CHANGELOG.md | head -1 | cut -d: -f1 || true)
            first=${first:-$(($(wc -l < CHANGELOG.md) + 1))}
            {
              head -n "$((first - 1))" CHANGELOG.md
              cat changelog-section.md
              tail -n "+${first}" CHANGELOG.md
            } > changelog-new.md
            mv changelog-new.md CHANGELOG.md

            git add CHANGELOG.md
            git commit -m "docs: CHANGELOG.md for ${TAG} [skip ci]"
            git tag "$TAG"

            # Load-bearing push first: if this fails, nothing is tagged and
            # nothing has touched main -- the run fails cleanly and can be
            # re-run. Only once the tag is safely on origin do we push the
            # cosmetic changelog commit, and that push must not fail the job
            # after a successful release.
            git push origin "$TAG"

            if ! git push origin HEAD:main; then
              echo "::warning::Tag ${TAG} was pushed and the release will proceed, but pushing the CHANGELOG.md commit to main failed (transient network issue or a race with another push to main). No manual fix is required -- the next release's changelog section automatically folds in whatever this one missed. To backfill immediately instead, run: bash scripts/generate-changelog.sh --section --to ${TAG} --header \"## ${TAG} (${DATE})\" and commit the result to main by hand."
            fi
          fi

      - name: Create Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.get_version.outputs.version }}"

          # Skip published releases so re-runs succeed without changing them.
          if IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            if [[ "$IS_DRAFT" == "false" ]]; then
              echo "::notice::release $TAG is already published; nothing to do"
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            gh release create "$TAG" --draft --title "Release $TAG" --notes-file changelog-section.md
          fi

          gh release edit "$TAG" --draft=false --latest
          echo "published=true" >> "$GITHUB_OUTPUT"

  image:
    name: Publish Container Image
    runs-on: ubuntu-latest
    needs: release
    # Runs on every successful release job, including a re-run of an
    # already-published version: pushing the same tags again is idempotent and
    # lets a failed image push be retried.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zirv-flow" >> "$GITHUB_OUTPUT"

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Log In To GHCR
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build And Push
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.release.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
