# Resource tiers for the capacity benchmarks. The tier budget is for zirv-flow only: serve, worker
# and scheduler share one cpuset of N logical CPUs and a memory budget split worker 50%, serve 40%,
# scheduler 10%, like one VM of that size. PostgreSQL is not part of the budget: it has no memory
# limit and its own cpuset that excludes the app's CPUs (default 8-31), and one fixed
# configuration in every tier, sized so that it is not the constraint. Layer this file on the
# other two and set the tier's variables (scripts/bench/tier.sh does this for S, M and L):
#
#   BENCH_APP_CPUSET=0-3 BENCH_MEM_WORKER=4096m BENCH_MEM_SERVE=3277m BENCH_MEM_SCHEDULER=819m \
#   docker compose -f docker-compose.yml -f scripts/bench/compose.bench.yaml \
#     -f scripts/bench/compose.tiers.yaml up -d --wait
#
# Worker concurrency is fixed at 4 in every tier (compose.bench.yaml). Local use only.
services:
  postgres:
    cpuset: ${BENCH_PG_CPUSET:-8-31}
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=16GB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=15min

  zirv-flow:
    cpuset: ${BENCH_APP_CPUSET:?set BENCH_APP_CPUSET, such as 0-3}
    mem_limit: ${BENCH_MEM_SERVE:?set BENCH_MEM_SERVE, such as 3277m}

  zirv-flow-worker:
    cpuset: ${BENCH_APP_CPUSET}
    mem_limit: ${BENCH_MEM_WORKER:?set BENCH_MEM_WORKER}

  zirv-flow-scheduler:
    cpuset: ${BENCH_APP_CPUSET}
    mem_limit: ${BENCH_MEM_SCHEDULER:?set BENCH_MEM_SCHEDULER}
