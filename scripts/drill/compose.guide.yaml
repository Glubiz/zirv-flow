# Applied on top of docker-compose.yml; the quickstart still owns the app, DB and key.
services:
  fixture:
    image: python:3.12.8-slim
    command: ["python3", "-B", "/fixture.py", "/data", "--capture"]
    volumes:
      - ./scripts/drill/upgrade-fixture.py:/fixture.py:ro
      - ${DRILL_WORK:?scratch directory required}:/data

  zirv-flow-key:
    image: ${DRILL_IMAGE:?image required}

  zirv-flow:
    image: ${DRILL_IMAGE:?image required}
    dns: ["${DRILL_DNS_IP:-127.0.0.1}"]
    environment:
      ZIRV_FLOW_SERVER__PUBLIC_URL: https://localhost:8443
      ZIRV_FLOW_EGRESS__ALLOW: '["${DRILL_DNS_IP:-127.0.0.1}/32"]'

  https:
    image: nginx:1.28.0-alpine
    volumes:
      - ${DRILL_WORK:?scratch directory required}:/data:ro
      - ./scripts/drill/guide-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8443:443"
