server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /data/smtp.pem;
    ssl_certificate_key /data/smtp.key;
    access_log off;
    location / {
        proxy_pass http://zirv-flow:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
