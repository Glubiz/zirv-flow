global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.rules.yml

scrape_configs:
  - job_name: zirv-flow-serve
    static_configs:
      - targets: ["zf-serve-1:8080", "zf-serve-2:8080"]
  - job_name: zirv-flow-worker
    static_configs:
      - targets: ["zf-worker-1:9100", "zf-worker-2:9100"]
    # Workers 3 and 4 exist only under the x5 profile; a name that does not resolve is no target.
    dns_sd_configs:
      - names: ["zf-worker-3", "zf-worker-4"]
        type: A
        port: 9100
    relabel_configs:
      - source_labels: [__meta_dns_name]
        regex: (.+)
        target_label: instance
        replacement: "$1:9100"
  - job_name: zirv-flow-scheduler
    static_configs:
      - targets: ["zf-scheduler:9100"]
  - job_name: sim-fixtures
    static_configs:
      - targets: ["mailer:8000", "smtp-sink:8025", "receiver:8000", "billing-api:8000"]
