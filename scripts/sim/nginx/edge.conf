}

server {
    listen 443 ssl;
    server_name receiver.sim.example.com;
    ssl_certificate /sim/tls/leaf.pem;
    ssl_certificate_key /sim/tls/leaf.key;
    access_log off;
    location / {
        set $upstream http://receiver:8000;
