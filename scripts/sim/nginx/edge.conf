}

# Static CSV host. nginx answers Range and If-Range natively, which the file source relies on.
server {
    listen 443 ssl;
    server_name exports.sim.example.com;
    ssl_certificate /sim/tls/leaf.pem;
    ssl_certificate_key /sim/tls/leaf.key;
    access_log off;
    location /exports/ {
        alias /sim/exports/;
        add_header Accept-Ranges bytes;
    }
}

# The public URL of the app (tracking and unsubscribe links in mail must be https, RFC 8058).
server {
    listen 443 ssl;
    server_name app.sim.example.com;
    ssl_certificate /sim/tls/leaf.pem;
    ssl_certificate_key /sim/tls/leaf.key;
    access_log off;
    client_max_body_size 16m;
    location / {
        set $upstream http://lb:8080;
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
    }
}
