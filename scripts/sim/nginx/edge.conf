# The TLS terminator of the HTTPS fixtures: one certificate, one server block per name.
# Variables in proxy_pass make nginx resolve at request time, so a restarted fixture is found again.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 443 ssl default_server;
    server_name edge;
    ssl_certificate /sim/tls/leaf.pem;
    ssl_certificate_key /sim/tls/leaf.key;
    access_log off;
    location = /healthz { return 200 "ok\n"; }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name billing-api.sim.example.com;
    ssl_certificate /sim/tls/leaf.pem;
    ssl_certificate_key /sim/tls/leaf.key;
    access_log off;
    location / {
        set $upstream http://billing-api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
    }
}

server {
    listen 443 ssl;
    server_name mailer-api.sim.example.com;
    ssl_certificate /sim/tls/leaf.pem;
    ssl_certificate_key /sim/tls/leaf.key;
    access_log off;
    location / {
        set $upstream http://mailer:8000;
        proxy_pass $upstream;
