# The HTTP front door: both serve processes, least connections.
# The upstreams resolve through Docker's resolver on each use, so a restarted serve is found again.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream serve {
    zone serve 64k;
    least_conn;
    server zf-serve-1:8080 resolve;
    server zf-serve-2:8080 resolve;
}

server {
    listen 8080;
    server_name _;
    access_log off;
    client_max_body_size 16m;

    location / {
        proxy_pass http://serve;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
