[workspace]
members = ["crates/*", "tools/loadgen"]
resolver = "3"

[workspace.package]
version = "0.34.0"
edition = "2024"
authors = ["Jonathan Solskov <josj@zirv.io>"]
license = "MIT"
repository = "https://github.com/Glubiz/zirv-flow"

[workspace.dependencies]
argon2 = { version = "0.6.0", features = ["alloc", "password-hash"] }
bytes = "1.12.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "matched-path"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.0", features = ["derive", "env"] }
croner = "4.0.1"
csv-core = "0.1.13"
figment = { version = "0.10.19", features = ["toml", "env"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
http-body-util = "0.1.5"
ipnet = "2.12.2"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "trace", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
rand = "0.8.5"
# Only here to choose the TLS stack for the OTLP exporter's HTTP client: rustls on the ring provider
# the tree already uses, never aws-lc or OpenSSL.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
rust-embed = { version = "8.13.0", default-features = false, features = ["interpolate-folder-path", "mime-guess"] }
rsa = { version = "0.9.2", features = ["pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "migrate", "macros", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid", "time", "json"] }
subtle = "2.6.1"
time = { version = "0.3.55", features = ["formatting", "macros", "serde-well-known"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "net", "signal", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "fmt", "json", "env-filter"] }
tower = { version = "0.5.3", features = ["util"] }
utoipa = { version = "5.5.0", features = ["uuid"] }
url = "2.5.8"
futures-util = { version = "0.3.34", default-features = false }
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
zirv-flow-api = { path = "crates/zirv-flow-api" }
zirv-flow-connectors = { path = "crates/zirv-flow-connectors" }
zirv-flow-core = { path = "crates/zirv-flow-core" }
zirv-flow-identity = { path = "crates/zirv-flow-identity" }
zirv-flow-jobs = { path = "crates/zirv-flow-jobs" }
zirv-flow-store = { path = "crates/zirv-flow-store" }

# No `panic = "abort"`: this will be a long-running server, where a panic in
# one task must not take the whole process down.
[profile.release]
lto = true
codegen-units = 1
debug = false
strip = "symbols"

# Test-only speed-up: the identity tests generate RSA keys, which is very slow unoptimised.
[profile.dev.package.num-bigint-dig]
opt-level = 3
