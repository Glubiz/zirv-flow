[workspace]
members = ["crates/*", "tools/loadgen"]
resolver = "3"

[workspace.package]
version = "0.114.0"
edition = "2024"
authors = ["Jonathan Solskov <josj@zirv.io>"]
license = "MIT"
repository = "https://github.com/Glubiz/zirv-flow"

[workspace.dependencies]
# Allowlist HTML sanitizer for the rich text of the block document (#238). Pure Rust, no features.
# Pinned: 4.2.4 (2026-10-17) for its sanitizer security fixes; ruling eea534b0 outranks the two-week age rule.
ammonia = { version = "=4.2.4", default-features = false }
argon2 = { version = "0.6.0", features = ["alloc", "password-hash"] }
bytes = "1.12.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "matched-path"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.0", features = ["derive", "env"] }
croner = "4.0.1"
csv-core = "0.1.13"
figment = { version = "0.10.19", features = ["toml", "env"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
getrandom = "0.4.3"
hashbrown = "0.17.1"
# DNS TXT lookups for sending-domain verification (#217). Plain DNS only: no `tls-*`, `https-*`, `quic-*`
# or `dnssec-*` feature, so neither OpenSSL nor aws-lc is in the tree. 0.26.3 was published 2026-09-10.
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio", "system-config"] }
hkdf = "0.13.0"
hmac = "0.13.0"
http-body-util = "0.1.5"
ipnet = "2.12.2"
metrics = "0.24.6"
minijinja = { version = "2.24.0", default-features = false, features = ["builtins", "macros", "multi_template", "serde", "fuel"] }
# MJML to HTML (#237). Parse and render only: no `json`, `print`, `async`, no `local-loader`, no
# `http-loader*` (so an `mj-include` can read nothing), no `css-inline`. Pinned: 6.0.1 was published
# 2026-04-25.
mrml = { version = "=6.0.1", default-features = false, features = ["parse", "render"] }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "trace", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
proptest = { version = "1", default-features = false, features = ["std"] }
rand = "0.8.5"
rlimit = "0.11.0"
# RSA-SHA256 DKIM signatures (#218): ring is already in the tree through rustls, and its private-key
# operations are constant-time. `rsa` stays for key generation only.
ring = "0.17.14"
# Only here to choose the TLS stack for the OTLP exporter's HTTP client: rustls on the ring provider
# the tree already uses, never aws-lc or OpenSSL.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1.0.9"
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
mysql_async = { version = "0.37.1", default-features = false, features = ["rustls-tls", "ring", "tls12", "minimal-rust"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
rskafka = { version = "0.6.0", default-features = false, features = ["compression-gzip", "compression-snappy", "compression-lz4", "compression-zstd", "transport-tls", "transport-socks5"] }
rust-embed = { version = "8.13.0", default-features = false, features = ["interpolate-folder-path", "mime-guess"] }
# RSA is used by the identity test mock and by DKIM key generation (#217): never to sign or decrypt.
rsa = { version = "0.9.2", features = ["pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "migrate", "macros", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid", "time", "json"] }
subtle = "2.6.1"
time = { version = "0.3.55", features = ["formatting", "macros", "serde-well-known"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-util", "net", "signal", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "registry", "fmt", "json", "env-filter"] }
tower = { version = "0.5.3", features = ["util"] }
utoipa = { version = "5.5.0", features = ["uuid"] }
url = "2.5.8"
futures-util = { version = "0.3.34", default-features = false }
uuid = { version = "1.28.0", features = ["v4", "v7", "serde"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
zirv-flow-ai = { path = "crates/zirv-flow-ai" }
zirv-flow-api = { path = "crates/zirv-flow-api" }
zirv-flow-connectors = { path = "crates/zirv-flow-connectors" }
zirv-flow-core = { path = "crates/zirv-flow-core" }
zirv-flow-engine = { path = "crates/zirv-flow-engine" }
zirv-flow-identity = { path = "crates/zirv-flow-identity" }
zirv-flow-jobs = { path = "crates/zirv-flow-jobs" }
zirv-flow-render = { path = "crates/zirv-flow-render" }
zirv-flow-segments = { path = "crates/zirv-flow-segments" }
zirv-flow-store = { path = "crates/zirv-flow-store" }
zirv-flow-templates = { path = "crates/zirv-flow-templates" }

# No `panic = "abort"`: this will be a long-running server, where a panic in
# one task must not take the whole process down.
[profile.release]
lto = true
codegen-units = 1
debug = false
strip = "symbols"

# Test-only speed-up: the identity tests generate RSA keys, which is very slow unoptimised.
[profile.dev.package.num-bigint-dig]
opt-level = 3
