[package]
name = "zirv-flow"
version = "0.1.0"
edition = "2024"
authors = ["Jonathan Solskov <josj@zirv.io>"]
description = "A self-hosted marketing automation tool: connect data sources, segment your people, and run automation flows."
repository = "https://github.com/Glubiz/zirv-flow"
license = "MIT"
readme = "README.md"
keywords = ["marketing-automation", "segmentation", "self-hosted", "automation", "workflow"]
categories = ["web-programming"]

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }

# No `panic = "abort"`: this will be a long-running server, where a panic in
# one task must not take the whole process down.
[profile.release]
lto = true
codegen-units = 1
debug = false
strip = "symbols"
