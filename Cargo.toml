[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
authors = ["Jonathan Solskov <josj@zirv.io>"]
license = "MIT"
repository = "https://github.com/Glubiz/zirv-flow"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "matched-path"] }
clap = { version = "4.6.0", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
http-body-util = "0.1.5"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "migrate", "macros", "runtime-tokio", "tls-rustls-ring-native-roots"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
utoipa = "5.5.0"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
zirv-flow-api = { path = "crates/zirv-flow-api" }
zirv-flow-core = { path = "crates/zirv-flow-core" }
zirv-flow-jobs = { path = "crates/zirv-flow-jobs" }
zirv-flow-store = { path = "crates/zirv-flow-store" }

# No `panic = "abort"`: this will be a long-running server, where a panic in
# one task must not take the whole process down.
[profile.release]
lto = true
codegen-units = 1
debug = false
strip = "symbols"
