[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# The 100,000-person criterion-4 test takes about two minutes, past the default limit.
[[profile.default.overrides]]
filter = 'package(zirv-flow-jobs) & test(a_segment_entry_trigger_for_100000_people_enrolls_each_exactly_once)'
slow-timeout = { period = "60s", terminate-after = 6 }

# The throughput tests drain thousands of jobs or people through one PostgreSQL server and run
# close to their 60 s wait on a busy CI runner, where they time out together when they also
# share it with each other. Running these one at a time keeps them from competing.
[test-groups]
db-throughput = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(zirv-flow-jobs) & (test(ten_thousand_jobs_on_four_workers_each_take_effect_exactly_once) | test(jobs_that_fail_once_are_retried_and_still_take_effect_exactly_once) | test(a_segment_entry_trigger_for_100000_people_enrolls_each_exactly_once))'
test-group = 'db-throughput'
